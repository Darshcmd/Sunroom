AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Sunroom photo sharing app using serverless AWS services.

Parameters:
  MonthlyPhotoLimit:
    Type: Number
    Default: 350
    MinValue: 0
    MaxValue: 350
    Description: Hard cap on photo uploads in one UTC month. Set to zero to pause uploads.
  AssetStorageLimitBytes:
    Type: Number
    Default: 4294967296
    MinValue: 6291456
    MaxValue: 4294967296
    Description: Hard cap for reserved source and thumbnail storage, 4 GiB maximum.
Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    Environment:
      Variables:
        TABLE_NAME: !Ref PhotoTable
        UPLOADS_BUCKET: !Ref UploadsBucket
        MEDIA_BUCKET: !Ref MediaBucket
        SITE_BUCKET: !Ref SiteBucket
        MAX_UPLOAD_BYTES: '2097152'
        ASSET_SLOT_BYTES: '6291456'
        ASSET_STORAGE_LIMIT_BYTES: !Sub '${AssetStorageLimitBytes}'
        MONTHLY_UPLOAD_LIMIT: !Sub '${MonthlyPhotoLimit}'
        SNS_TOPIC_PREFIX: sunroom-

Resources:
  PhotoTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 3
      StreamSpecification:
        StreamViewType: OLD_IMAGE
      TimeToLiveSpecification:
        AttributeName: expiresAtEpoch
        Enabled: true
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: PublicGallery
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - photoId
              - caption
              - displayName
              - createdAt
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 3
        - IndexName: OwnerGallery
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection:
            ProjectionType: INCLUDE
            NonKeyAttributes:
              - photoId
              - status
              - caption
              - displayName
              - createdAt
              - reservationBytes
              - uploadExpiresAt
          ProvisionedThroughput:
            ReadCapacityUnits: 5
            WriteCapacityUnits: 3
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false
      SSESpecification:
        SSEEnabled: true

  UploadsBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - '*'
            AllowedMethods:
              - PUT
            AllowedOrigins:
              - '*'
            ExposedHeaders:
              - ETag
            MaxAge: 600
      LifecycleConfiguration:
        Rules:
          - Id: RemoveStagedOrphanUploads
            Status: Enabled
            Prefix: incoming/
            ExpirationInDays: 1
      NotificationConfiguration:
        EventBridgeConfiguration:
          EventBridgeEnabled: true

  MediaBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    UpdateReplacePolicy: Delete
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub ${AWS::StackName}-users
      UsernameAttributes:
        - email
      AutoVerifiedAttributes:
        - email
      MfaConfiguration: 'OFF'
      Policies:
        PasswordPolicy:
          MinimumLength: 10
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
          TemporaryPasswordValidityDays: 7
      Schema:
        - Name: email
          AttributeDataType: String
          Required: true
          Mutable: true
        - Name: name
          AttributeDataType: String
          Required: false
          Mutable: true

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      UserPoolId: !Ref UserPool
      ClientName: !Sub ${AWS::StackName}-web
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_USER_SRP_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      RefreshTokenValidity: 7
      TokenValidityUnits:
        RefreshToken: days
        AccessToken: hours
        IdToken: hours
      AccessTokenValidity: 1
      IdTokenValidity: 1

  PhotoApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: $default
      CorsConfiguration:
        AllowOrigins:
          - '*'
        AllowHeaders:
          - authorization
          - content-type
        AllowMethods:
          - GET
          - POST
          - DELETE
          - OPTIONS
        MaxAge: 600
      DefaultRouteSettings:
        ThrottlingBurstLimit: 10
        ThrottlingRateLimit: 2
      Auth:
        Authorizers:
          CognitoAuthorizer:
            IdentitySource: $request.header.Authorization
            JwtConfiguration:
              Audience:
                - !Ref UserPoolClient
              Issuer: !Sub https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}

  PhotoApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-api
      CodeUri: backend/api/
      Handler: app.api_handler
      MemorySize: 128
      Timeout: 15
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: WARN
        SystemLogLevel: WARN
        LogGroup: !Ref ApiLogGroup
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:Query
                - dynamodb:TransactWriteItems
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
              Resource:
                - !GetAtt PhotoTable.Arn
                - !Sub ${PhotoTable.Arn}/index/*
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${UploadsBucket.Arn}/incoming/*
            - Effect: Allow
              Action: s3:GetObject
              Resource:
                - !Sub ${SiteBucket.Arn}/*
                - !Sub ${MediaBucket.Arn}/photos/*
            - Effect: Allow
              Action: s3:DeleteObject
              Resource:
                - !Sub ${UploadsBucket.Arn}/incoming/*
                - !Sub ${UploadsBucket.Arn}/originals/*
                - !Sub ${MediaBucket.Arn}/photos/*
            - Effect: Allow
              Action:
                - sns:CreateTopic
                - sns:ListSubscriptionsByTopic
                - sns:Subscribe
              Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:sunroom-*
      Events:
        SiteRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref PhotoApi
            Path: /
            Method: GET
        SiteAssets:
          Type: HttpApi
          Properties:
            ApiId: !Ref PhotoApi
            Path: /{proxy+}
            Method: GET
        PublicGallery:
          Type: HttpApi
          Properties:
            ApiId: !Ref PhotoApi
            Path: /photos
            Method: GET
        MyPhotos:
          Type: HttpApi
          Properties:
            ApiId: !Ref PhotoApi
            Path: /my/photos
            Method: GET
            Auth:
              Authorizer: CognitoAuthorizer
        CreatePhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref PhotoApi
            Path: /uploads
            Method: POST
            Auth:
              Authorizer: CognitoAuthorizer
        DeletePhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref PhotoApi
            Path: /my/photos/{photoId}
            Method: DELETE
            Auth:
              Authorizer: CognitoAuthorizer

  WorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-workflow
      CodeUri: backend/workflow/
      Handler: app.workflow_handler
      MemorySize: 1024
      Timeout: 60
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: WARN
        SystemLogLevel: WARN
        LogGroup: !Ref WorkflowLogGroup
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:TransactWriteItems
                - dynamodb:UpdateItem
              Resource: !GetAtt PhotoTable.Arn
            - Effect: Allow
              Action: s3:GetObject
              Resource: !Sub ${UploadsBucket.Arn}/incoming/*
            - Effect: Allow
              Action: s3:DeleteObject
              Resource:
                - !Sub ${UploadsBucket.Arn}/incoming/*
                - !Sub ${UploadsBucket.Arn}/originals/*
            - Effect: Allow
              Action: s3:PutObject
              Resource: !Sub ${UploadsBucket.Arn}/originals/*
            - Effect: Allow
              Action:
                - s3:PutObject
                - s3:DeleteObject
              Resource: !Sub ${MediaBucket.Arn}/photos/*
            - Effect: Allow
              Action: sns:Publish
              Resource: !Sub arn:${AWS::Partition}:sns:${AWS::Region}:${AWS::AccountId}:sunroom-*

  StartWorkflowFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-start-workflow
      CodeUri: backend/start_workflow/
      Handler: app.start_workflow_handler
      MemorySize: 128
      Timeout: 10
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: WARN
        SystemLogLevel: WARN
        LogGroup: !Ref StartWorkflowLogGroup
      Environment:
        Variables:
          STATE_MACHINE_ARN: !Ref PhotoWorkflow
      Policies:
        - Statement:
            - Effect: Allow
              Action: states:StartExecution
              Resource: !Ref PhotoWorkflow

  CleanupExpiredUploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-cleanup
      CodeUri: backend/cleanup/
      Handler: app.cleanup_handler
      MemorySize: 128
      Timeout: 15
      LoggingConfig:
        LogFormat: JSON
        ApplicationLogLevel: WARN
        SystemLogLevel: WARN
        LogGroup: !Ref CleanupLogGroup
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - dynamodb:GetItem
                - dynamodb:PutItem
                - dynamodb:TransactWriteItems
              Resource: !GetAtt PhotoTable.Arn
            - Effect: Allow
              Action:
                - dynamodb:DescribeStream
                - dynamodb:GetRecords
                - dynamodb:GetShardIterator
              Resource: !GetAtt PhotoTable.StreamArn
            - Effect: Allow
              Action: dynamodb:ListStreams
              Resource: '*'
            - Effect: Allow
              Action: s3:DeleteObject
              Resource: !Sub ${UploadsBucket.Arn}/incoming/*
      Events:
        ExpiredPhotoRecords:
          Type: DynamoDB
          Properties:
            Stream: !GetAtt PhotoTable.StreamArn
            StartingPosition: TRIM_HORIZON
            BatchSize: 10
            MaximumRetryAttempts: 5
            BisectBatchOnFunctionError: true

  PhotoWorkflow:
    Type: AWS::Serverless::StateMachine
    Properties:
      Name: !Sub ${AWS::StackName}-photo-processing
      Type: STANDARD
      DefinitionUri: statemachine/photo-processing.asl.json
      DefinitionSubstitutions:
        WorkflowFunctionArn: !GetAtt WorkflowFunction.Arn
      Policies:
        - LambdaInvokePolicy:
            FunctionName: !Ref WorkflowFunction

  UploadCreatedRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Start photo processing when an upload lands in the private bucket.
      EventPattern:
        source:
          - aws.s3
        detail-type:
          - Object Created
        detail:
          bucket:
            name:
              - !Ref UploadsBucket
          object:
            key:
              - prefix: incoming/
      State: ENABLED
      Targets:
        - Arn: !GetAtt StartWorkflowFunction.Arn
          Id: StartPhotoWorkflow

  AllowEventBridgeToStartWorkflow:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref StartWorkflowFunction
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt UploadCreatedRule.Arn

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-api
      RetentionInDays: 3

  WorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-workflow
      RetentionInDays: 3

  StartWorkflowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-start-workflow
      RetentionInDays: 3

  CleanupLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub /aws/lambda/${AWS::StackName}-cleanup
      RetentionInDays: 3

Outputs:
  SiteUrl:
    Description: HTTPS address for the Sunroom website and API.
    Value: !Sub https://${PhotoApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  ApiUrl:
    Description: HTTPS API base URL.
    Value: !Sub https://${PhotoApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}
  SiteBucketName:
    Description: Private bucket for the static frontend.
    Value: !Ref SiteBucket
  UploadsBucketName:
    Description: Private bucket for staged source images and private originals.
    Value: !Ref UploadsBucket
  MediaBucketName:
    Description: Private bucket for generated thumbnail files.
    Value: !Ref MediaBucket
  UserPoolId:
    Description: Cognito user pool id.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Public Cognito app client id.
    Value: !Ref UserPoolClient
